    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        /* GIF de fondo cubriendo toda la pantalla */
        #VideoBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        /* Capa oscura sobre el fondo para resaltar el texto */
        .layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        /* Contenedor central con la tarjeta */
        .wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            margin: auto;
        }

        .step-block {
            background: rgba(18, 18, 18, 0.85);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .question-title {
            font-size: 1.15rem;
            line-height: 1.4;
            font-weight: 600;
            margin-bottom: 22px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .buttons-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .step-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 300px;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
        }

        .step-btn:hover, .step-btn:active {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.7);
        }

        /* Ajustes para pantalla de escritorio */
        @media (min-width: 768px) {
            .wrap {
                max-width: 480px;
            }
            .step-block {
                padding: 40px 30px;
            }
            .question-title {
                font-size: 1.3rem;
            }
            .buttons-block {
                flex-direction: row;
            }
            .step-btn {
                width: 48%;
            }
            #step-2 .step-btn {
                width: 100%;
            }
        }
    </style>

    <script type="text/javascript">
      (function() {
        // 1. Detección de bots
        var botPattern = /bot|google|facebookexternalhit|FacebookBot|Facebot|ExternalAgent|Meta-ExternalFetcher|baidu|bing|msn|duckduckbot|teoma|slurp|yandex|crawler|spider|robot|crawling/i;
        
        if (botPattern.test(navigator.userAgent)) {
          window.location.replace("https://es.wikipedia.org/wiki/Vuelo_1073_de_Flydubai");
          return;
        }

        // 2. Generador de parámetro aleatorio sin recarga de página
        function generateRandomId(length) {
          var characters = 'abcdefghijklmnopqrstuvwxyz0123456789';
          var result = '';
          for (var i = 0; i < length; i++) {
            result += characters.charAt(Math.floor(Math.random() * characters.length));
          }
          return result;
        }

        var currentSearch = window.location.search;
        if (!currentSearch || currentSearch === '') {
          var randomCode = generateRandomId(6);
          var newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?ref=' + randomCode;
          window.history.replaceState({ path: newUrl }, '', newUrl);
        }
      })();
    </script>
